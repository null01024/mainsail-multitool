name: Release

run-name: Release ${{ inputs.version || github.sha }}

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version without v (leave empty to increment the multitool version)
        required: false

permissions:
  contents: write

concurrency:
  group: mainsail-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and release
    if: >-
      github.repository == 'null01024/mainsail-multitool' &&
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Allocate or recover the release version
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/github-release.js prepare

      - name: Set the build version
        if: steps.prepare.outputs.completed != 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: npm version --no-git-tag-version --ignore-scripts "$RELEASE_VERSION"

      - name: Build
        if: steps.prepare.outputs.completed != 'true'
        run: npm run build

      - name: Stage and verify the build
        if: steps.prepare.outputs.completed != 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          cp dist/mainsail.zip "$RUNNER_TEMP/mainsail-release/mainsail.zip"
          node scripts/github-release.js verify

      - name: Generate release notes
        if: steps.prepare.outputs.completed != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff-release.toml
          args: --tag ${{ steps.prepare.outputs.tag }} ${{ steps.prepare.outputs.changelog_range }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ runner.temp }}/mainsail-release/changes.md

      - name: Generate CHANGELOG
        if: steps.prepare.outputs.completed != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.prepare.outputs.tag }}
        env:
          OUTPUT: ${{ runner.temp }}/mainsail-release/CHANGELOG.md

      - name: Add release provenance
        if: steps.prepare.outputs.completed != 'true'
        run: node scripts/github-release.js notes

      - name: Upload build artifact
        if: steps.prepare.outputs.completed != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: mainsail-${{ steps.prepare.outputs.tag }}
          overwrite: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mainsail-release/mainsail.zip
            ${{ runner.temp }}/mainsail-release/CHANGELOG.md
            ${{ runner.temp }}/mainsail-release/release-notes.md

      - name: Create draft and upload build
        if: steps.prepare.outputs.completed != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.prepare.outputs.tag }}
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: 'false'
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/mainsail-release/mainsail.zip
          body_path: ${{ runner.temp }}/mainsail-release/release-notes.md

      - name: Verify uploaded asset and publish
        if: steps.prepare.outputs.completed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: node scripts/github-release.js publish
